name: credentials

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, not per-build: several verification registries rate-limit.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  integrity:
    name: PII + schema + report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Never-publish scan
        run: node scripts/check-pii.mjs

      - name: Validate credentials schema
        run: node scripts/validate-credentials.mjs

      - name: Verification report is committed and current
        run: |
          node scripts/gen-verification-report.mjs
          git diff --exit-code -- VERIFICATION_REPORT.md \
            || { echo "::error::VERIFICATION_REPORT.md is stale. Run 'npm run report' and commit it."; exit 1; }

  links:
    name: Verification links are alive
    # Weekly and on demand only — registries rate-limit and one is behind a reCAPTCHA.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
